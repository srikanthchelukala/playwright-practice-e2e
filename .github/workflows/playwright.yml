name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'firefox'
        type: choice
        options:
          - chrome
          - firefox
          - webkit
      environment:
        description: 'Environment to run tests on'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - production

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'
    - name: Build & Install
      run: mvn -B install -D skipTests --no-transfer-progress
    - name: Ensure browsers are installed
      run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"
    - name: Run tests
      run: mvn test -PRegression -Dbrowser=${{ github.event.inputs.browser }} -Denvironment=${{ github.event.inputs.environment }}  -Dheadless=true
      # run: mvn test -PFramework -Dbrowser=${{ github.event.inputs.browser }} -Denv=${{ github.event.inputs.environment }} -Dheadless=${{ github.event.inputs.headless }}